    notes:
      - >-
        carrythroughOwnedInternalAllowed is FALSE here and true elsewhere. The
        standing rule is that Antigravity is a remote provider and must never
        receive material marked local-only or confidential-to-device; public
        benchmark corpus only until that boundary is written down somewhere it can
        be cited.
      - Terms and retention posture are unsnapshotted and recorded as unknown rather than assumed favourable.

