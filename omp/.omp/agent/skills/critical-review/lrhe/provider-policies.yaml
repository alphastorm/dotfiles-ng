      capacity: individual
      effectiveDate: "2026-07-27"
      scope: personal_internal_evaluation_review_and_routing
      recordPath: authorizations/2026-07-27-operator-risk-acceptance.md
      recordSha256: 7a817ffba857f699d59f09b090188a680c9d254410bb3c428fb338bc5fb27055
    notes:
      - >-
        carrythroughOwnedInternalAllowed is TRUE under the dated operator
        authorization for owned repository work and research. Customer data and
        third-party confidential data remain separately disallowed until their
        owners grant explicit rights; those fields are explicit data-rights gates,
        not inferred OMP routing categories. An explicit NO_CLOUD marker still blocks.
      - >-
        Terms ARE now snapshotted (Antigravity's own Terms of Service plus Google's
        Generative AI Additional Terms, which is the governing data-use document
        since Antigravity publishes no privacy page of its own). providerTrainingUse
        and providerRetention stay `unknown` regardless: the documents exist in the
        snapshot and nobody has read them to a conclusion. Reading 560KB of terms to
        a retention posture is a legal determination, not a field an agent should
        fill in.

