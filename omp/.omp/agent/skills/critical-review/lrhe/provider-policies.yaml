  # The three routes below predate this registry. Their evaluation lanes were
  # enabled before any rights apparatus existed, so they had no governing policy.
  # run_review.py refused every one until policies existed. That is the gate
  # working rather than a regression: an enabled lane with no policy is an
  # oversight nobody had a way to see.
  #
  # They inherit the same operator risk acceptance. Their terms are NOT snapshotted
  # -- termsSnapshotId says so in the id rather than pointing at a file that does
  # not exist -- so `providerTrainingUse` and `providerRetention` are recorded as
  # `unknown`, which is honest and, being downstream-use descriptors rather than
  # egress gates, does not block a public-corpus run. Snapshot them before any
  # result from these lanes is published.

