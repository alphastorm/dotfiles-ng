# Frozen panel definitions. LRHE-PROTOCOL.md section 5.6 of the OpenCode handoff
# asks for these to live in configuration rather than Python constants, because a
# panel edited in source is a design change with no artifact and no digest.
#
# What this file owns: which experiment exists, which families are in its panel,
# which lenses rotate, and which arms it schedules.
#
# What this file does NOT own: whether a lane is live. That is
# `skill://critical-review/qualification.yml`, which the SKILL reads before
# dispatch and which carries the per-lane canary results and blockers. Two files
# claiming to answer "is this reviewer enabled" is how they come to disagree.
#
# Also deliberately absent: spend caps and quota balances. This package is public.
# Budget lives with the handoff in the private package.
#
# `family` ids are short and stable (`claude`, not `anthropic_claude`). The vendor
# prefix adds no information a lineage id needs, and route and model identity are
# recorded separately per run in `reviewer.provider_route`, `requested_model` and
# `served_model` -- which is the distinction section 5.6 actually cares about.

schemaVersion: 1

# Arms are shared across experiments; an arm means the same thing everywhere or
# the cross-experiment comparisons are meaningless.
arms:
  A:      {role: author,  description: the integrator's own pass over its own work}
  B:      {role: critic,  description: one rotating critic per item}
  C:      {role: critic,  description: every family once, on the floor lens}
  D:      {role: critic,  description: the Latin square; the only arm where lens varies}
  T:      {role: critic,  description: one family repeated; the empirical null}
  R:      {role: refuter, description: cold falsification, scheduled per disputed claim}
  probe:  {role: critic,  description: contamination probe; no repository, no tools}
  smoke:  {role: critic,  description: plumbing validation; never a benchmark observation}
  OC_SCREEN: {role: critic, description: the twelve-item promotion screen; a go/no-go on
              operational failure, never a recall ranking}
  OC_SCREEN_NULL: {role: critic, description: the screen's null stratum extended to the
                   corpus's other two S5 items; a targeted follow-up on one result,
                   outside the frozen twelve and never merged into them}
  T_OC: {role: critic, description: the OpenCode panel's matched null -- one family
         repeated over the screen items. Three replicates, not the pre-registered
         four, because the four was derived from a four-family panel and MiniMax is
         held; a four-sample null against three families would leave union coverage
         partly measuring the arity gap}
  OC_FULL: {role: critic, description: the 47-item OpenCode floor panel; the primary
            measurement, every promoted family on the common floor prompt}
  OC_WITNESS: {role: critic, description: one fixed item re-run at every batch boundary
               of OC_FULL. The only available signal that a provider swapped the
               checkpoint behind a stable selector mid-panel, since OpenCode exposes no
               fingerprint; never a benchmark observation}

# Excluded from performance estimates by every analysis. Arm A is the author, R is
# scheduled per claim rather than per item, probe and smoke never saw the repository
# under production conditions, and OC_SCREEN is twelve items -- enough to catch a
# lane that cannot hold a contract, nowhere near enough to rank three that can.
#
# These are the DEFAULTS. An experiment may override any of them, and the OpenCode
# panel does: its arms are OC_FULL and T_OC, so inheriting `C`/`D`/`T` selected no
# runs at all and every arm-keyed statistic returned a clean empty result --
# `families: []` on a three-family panel, and a matched null reported as "was not
# run" while its 36 runs sat one file over. `analyze_lrhe.resolve_arm_roles()` reads
# these; before it existed they were documentation and the analyzer's four module
# constants were the real configuration.
councilArms: [C, D]
nullArm: T
squareArm: D
floorArm: C

# The lens assignment, as text the runner transmits.
#
# It used to live in the agent definitions -- one hardcoded `Primary lens:` line
# each in review-claude, review-gemini and review-grok, and none at all in the four
# floor agents. Family therefore determined agent determined lens, one to one,
# while `lens_sets()` counterbalanced families over lenses, arm D was documented as
# the only arm where lens varies, and `power_lrhe.py` tested a family x lens
# interaction. All of that assumed a lens could be assigned at dispatch. None of it
# could be delivered: the field was recorded on every run and transmitted on none,
# so arm D would have carried four lens labels over reviewers that each received
# exactly one. Moving the text here is what makes the rotation real, and it is the
# reason the lens belongs in configuration -- a lens edited inside an agent is a
# design change with no artifact and no digest, the same argument that put the
# panels here.
#
# Wording is verbatim from the three agents it came from, so this is a move rather
# than a rewrite and the core panel's prompts are unchanged.
lenses:
  architecture: >-
    Primary lens: architectural and semantic coherence. Trace abstractions, APIs,
    invariants, ownership boundaries, lifecycle semantics, and failure contracts.
    Look for local patches concealing structural defects, but do not recommend a
    rewrite unless a named invariant requires it.
  whole_repo: >-
    Primary lens: whole-repository and long-context coverage. Trace distant
    callers, schemas, configuration paths, migrations, dataflow, deployment
    assumptions, compatibility contracts, operational procedures, and omissions.
    Expand selectively from the changed-surface map and verify important primary
    evidence rather than trusting summaries.
  adversarial: >-
    Primary lens: adversarial and contrarian failure analysis. Trace hostile
    inputs, privilege escalation, fail-open behavior, races, deadlocks, corruption,
    partial outages, recovery failure, rollback failure, resource exhaustion, and
    abuse. Prefer a concrete exploit path, failure schedule, or counterexample over
    rhetorical suspicion.
  independent: >-
    Primary lens: independent reconstruction. Rebuild the system and its invariants
    from primary evidence rather than checking the author's framing, and report
    where the evidence does not support the design as stated. Deliberately broader
    than the other lenses, so that it can surface defects the hand-designed
    taxonomy itself omits.
  # The floor is the absence of a lens, and saying so is not the same as saying
  # nothing: every family gets the identical prompt, which is what isolates family
  # and route behaviour from lens behaviour. An empty string here would read as an
  # oversight, and a missing key would fail the check that every declared lens has
  # text.
  floor: ""

experiments:
  - experimentId: lrhe-core-v1
    panelId: core-cgg-v1
    promptVersion: core-lens-v1
    contextConfig: retrieval
    authorFamily: gpt
    refuterFamily: glm
    nullFamily: claude
    lenses: [architecture, whole_repo, adversarial]
    families:
      - {family: claude, providerRoute: anthropic-subscription, requestedSelector: "anthropic/claude-opus-5:max"}
      - {family: gemini, providerRoute: google-antigravity,     requestedSelector: "google-antigravity/gemini-3.6-flash:high"}
      - {family: grok,   providerRoute: xai-oauth,              requestedSelector: "xai-oauth/grok-build"}

  # The tool's DEFAULT matrix, not a preregistration. `build_corpus.py assignments`
  # with no --experiment-id produces this: four critics over four lenses, 762
  # reviewer runs. The preregistered 3x3 core lens experiment above is the subset,
  # reproduced exactly with --experiment-id lrhe-core-v1 (523 + 141 probe).
  #
  # `independent` is a real fourth lens, not a relabelling of the other three. Its
  # assignment is deliberately broader -- reconstruct the system and its invariants
  # from primary evidence rather than checking the author's framing -- so it can
  # surface defects the hand-designed taxonomy itself omits. That is exactly the
  # blind spot a fixed three-lens council cannot measure from the inside.
  - experimentId: lrhe-core-expanded-v1
    panelId: core-expanded-v1
    promptVersion: core-lens-v1
    contextConfig: retrieval
    authorFamily: gpt
    refuterFamily: glm
    nullFamily: claude
    lenses: [architecture, whole_repo, adversarial, independent]
    families:
      - {family: claude, providerRoute: anthropic-subscription, requestedSelector: "anthropic/claude-opus-5:max"}
      - {family: gemini, providerRoute: google-antigravity,     requestedSelector: "google-antigravity/gemini-3.6-flash:high"}
      - {family: grok,   providerRoute: xai-oauth,              requestedSelector: "xai-oauth/grok-build"}
      - {family: kimi,   providerRoute: opencode-go,            requestedSelector: opencode-go/kimi-k3}

  # The floor comparison. Every family gets the SAME prompt, which is what isolates
  # family and route behaviour from lens behaviour. Do not add a lens rotation here
  # until the floor panel is complete -- a 4x3 role design on 47 items is
  # underpowered, and section 6 Commit 12 defers it deliberately.
  - experimentId: lrhe-opencode-v1
    panelId: opencode-broad-v1
    # This panel's arms, overriding the defaults above. `OC_FULL` is the primary
    # measurement and the only council arm: there is no lens rotation here, so there is
    # no second arm to pool with it.
    #
    # `floorArm` is `OC_SCREEN`, not `OC_FULL`, and that is not a typo. The decorrelation
    # contrast needs one floor-lens run per family against one per replicate ON THE SAME
    # ITEMS. `T_OC` was run over the twelve screen items; `OC_FULL`'s selection rule is
    # "the 35 corpus items the twelve-item screen did not use". The two are disjoint by
    # construction, so the contrast against `OC_FULL` is not merely unmeasured, it is
    # unmeasurable -- and pointing `floorArm` at `OC_FULL` made the analyzer say so in
    # words that read like a missing run rather than a design gap.
    #
    # So the decorrelation estimate is scoped to the twelve screen items, where both arms
    # ran. The floor panel has NO matched null of its own. That is a real gap: closing it
    # needs a `T_OC`-style null over floor-panel items, which is not authorized and is
    # recorded rather than papered over.
    councilArms: [OC_FULL]
    nullArm: T_OC
    floorArm: OC_SCREEN
    squareArm: OC_FULL
    # v2 is the enforced tool surface. v1 declared `tools: [read, grep, glob, lsp,
    # ast_grep]` on every floor reviewer while the packet said the document was the
    # whole of the evidence, so the boundary was prose; 106 units ran under it and are
    # invalidated. v2 is `tools: []` and says so in the prompt. The version is what
    # keeps the two cohorts from pooling by accident.
    promptVersion: opencode-floor-v2
    contextConfig: retrieval
    authorFamily: gpt
    nullFamily: kimi
    lenses: [floor]
    # Selectors are INTENDED, not discovered. Section 6 Commit 6 requires resolving
    # them against the installed build and recording what the provider actually
    # reports; nothing here has been verified to resolve.
    families:
      - {family: kimi,     providerRoute: opencode-go, requestedSelector: opencode-go/kimi-k3}
      - {family: glm,      providerRoute: opencode-go, requestedSelector: opencode-go/glm-5.2}
      - {family: minimax,  providerRoute: opencode-go, requestedSelector: opencode-go/minimax-m3}
      - {family: deepseek, providerRoute: opencode-go, requestedSelector: opencode-go/deepseek-v4-pro}

  - experimentId: live-critical-review-v1
    panelId: opencode-broad-v1
    promptVersion: opencode-floor-v2
    contextConfig: retrieval
    authorFamily: gpt
    lenses: [floor]
    # The baseline ledger is built from these before any shadow output is visible.
    # Showing the lead everything first makes independent contribution and synthesis
    # contamination indistinguishable, which is the one thing this dataset exists to
    # separate.
    baselineVisibleFamilies: [kimi]
    withheldShadowFamilies: [glm, minimax, deepseek]
    families:
      - {family: kimi,     providerRoute: opencode-go, requestedSelector: opencode-go/kimi-k3}
      - {family: glm,      providerRoute: opencode-go, requestedSelector: opencode-go/glm-5.2}
      - {family: minimax,  providerRoute: opencode-go, requestedSelector: opencode-go/minimax-m3}
      - {family: deepseek, providerRoute: opencode-go, requestedSelector: opencode-go/deepseek-v4-pro}
