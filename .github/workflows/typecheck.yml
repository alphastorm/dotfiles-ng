# The OMP extensions import only types from @oh-my-pi/pi-coding-agent, so nothing
# at runtime checks them against OMP's API. Typecheck them here to catch API drift.

name: typecheck

on:
  push:
    branches: [master]
    paths: ['**/*.ts', 'package.json', 'bun.lock', 'tsconfig.json', 'setup.sh', 'update.sh', 'tests/**', '.github/workflows/typecheck.yml']
  pull_request:
    paths: ['**/*.ts', 'package.json', 'bun.lock', 'tsconfig.json', 'setup.sh', 'update.sh', 'tests/**', '.github/workflows/typecheck.yml']

# Only superseded PR runs cancel; pushes and dispatches use unique run groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The setup-check tests simulate restow.
      - name: Install Stow
        run: sudo apt-get install -y --no-install-recommends stow

      - name: Behaviour tests
        run: bun test ./tests ./omp/.omp/agent/skills/critical-review/lrhe/critical-review-policy.test.ts
