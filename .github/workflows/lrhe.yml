# The LRHE harness produces a preregistered result set that people are supposed to
# be able to audit. Its tests defend failures that are *silent* -- a scorer that
# drops an arm, a gate that stops being called, a policy that cites a snapshot
# nobody fetched -- and a suite nobody runs decays into decoration.
#
# 130 of the 161 tests need nothing but this repository. The remaining 31 read the
# private package -- corpus and reviewer agents -- and skip cleanly when absent,
# which is exactly what happens here: the corpus and its answer key live in a
# separate private repository and must never reach a public runner.
# Do not "fix" the skips by checking it out.
#
# Path-filtered because this is a dotfiles repo; a zsh change should not spend two
# minutes proving the corpus builder still imports.

name: lrhe
run-name: lrhe / ${{ github.event_name == 'workflow_dispatch' && inputs.execution_pool || 'github-hosted' }} / ${{ github.event_name == 'workflow_dispatch' && inputs.dispatch_id || github.sha }}

on:
  push:
    paths: ['omp/.omp/agent/skills/critical-review/lrhe/**', '.github/workflows/lrhe.yml']
  pull_request:
    paths: ['omp/.omp/agent/skills/critical-review/lrhe/**', '.github/workflows/lrhe.yml']
  workflow_dispatch:
    inputs:
      execution_pool:
        description: Execution pool; fleet is for trusted controller dispatches only
        required: true
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - fleet
      dispatch_id:
        description: Controller correlation identifier
        required: false
        default: manual
        type: string
      routing_label:
        description: Controller-supplied one-time runner label; leave blank in the GitHub UI
        required: false
        type: string
      target_sha:
        description: Exact commit tested by the fleet runner
        required: false
        type: string
      fleet_site:
        description: Site expected to execute this bounded dispatch
        required: false
        default: nyc-pc
        type: choice
        options:
          - nyc-pc
          - sf-pc

defaults:
  run:
    working-directory: omp/.omp/agent/skills/critical-review/lrhe

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.execution_pool == 'github-hosted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          # requirements.txt is fully pinned and a test enforces that, so the
          # cache key is honest.
          cache: pip
          cache-dependency-path: omp/.omp/agent/skills/critical-review/lrhe/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check . --exclude .venv

      # Fails on a schema that stopped parsing, a policy citing a snapshot nobody
      # fetched, a panel route with no policy behind it. Cheap, and none of it
      # needs the corpus. Run before the slow suite so a config break reports in
      # seconds rather than after a minute of scoring.
      - name: Cross-file invariants
        run: python -m pytest test_consistency.py -q

      - name: Test suite
        run: python -m pytest -q --durations=10

      # A gate is only a gate if nothing can reach a provider around it. `none` is
      # the default transport and raises on any send; assert here that no live
      # transport has appeared, because the day one does is the day this workflow
      # starts mattering more than it does now.
      - name: No live transport exists
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, '.')
          import run_review
          assert 'live' not in run_review.TRANSPORTS, 'a live transport was added'
          assert run_review.TRANSPORTS['none'] is run_review.no_egress_transport
          print('transports:', sorted(run_review.TRANSPORTS))
          PY

  fleet-shadow:
    name: LRHE fleet shadow
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          inputs.execution_pool == 'fleet' &&
          startsWith(inputs.routing_label, 'lrhe-linux-x64-') &&
          inputs.target_sha != '' }}
    runs-on:
      - self-hosted
      - Linux
      - X64
      - profile-lrhe
      - ${{ inputs.fleet_site == 'nyc-pc' && 'site-nyc' || inputs.fleet_site == 'sf-pc' && 'site-sf' || 'site-invalid' }}
      - ${{ inputs.routing_label }}
    timeout-minutes: 15
    steps:
      - name: Validate bounded LRHE dispatch
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          FLEET_SITE: ${{ inputs.fleet_site }}
          ROUTING_LABEL: ${{ inputs.routing_label }}
          RUNNER_NAME: ${{ runner.name }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          shopt -u nocasematch
          export LC_ALL=C
          fail() {
            printf 'invalid LRHE fleet dispatch: %s\n' "$1" >&2
            exit 2
          }
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] || fail target_sha
          [[ "$ROUTING_LABEL" =~ ^lrhe-linux-x64-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]] || fail routing_label
          case "$FLEET_SITE" in
            nyc-pc) site_short=nyc ;;
            sf-pc) site_short=sf ;;
            *) fail fleet_site ;;
          esac
          [[ "$DISPATCH_ID" =~ ^lrhe-${site_short}-[0-9]{8}T[0-9]{6}Z-[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$ ]] || fail dispatch_id
          [[ "$RUNNER_NAME" == gateway-ci-${site_short}-1 ]] || fail runner_name
          [[ ! -S /var/run/docker.sock ]] || fail docker_socket

      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Configure disposable Python cache
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/pip-cache"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip-cache" >> "$GITHUB_ENV"

      - name: Verify exact target
        working-directory: ${{ github.workspace }}
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: omp/.omp/agent/skills/critical-review/lrhe/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check . --exclude .venv

      - name: Cross-file invariants
        run: python -m pytest test_consistency.py -q

      - name: Test suite
        run: python -m pytest -q --durations=10

      - name: No live transport exists
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, '.')
          import run_review
          assert 'live' not in run_review.TRANSPORTS, 'a live transport was added'
          assert run_review.TRANSPORTS['none'] is run_review.no_egress_transport
          print('transports:', sorted(run_review.TRANSPORTS))
          PY
